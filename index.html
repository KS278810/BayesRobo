<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BayesRobo Web</title>
<link rel="icon" href="./assets/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="192x192" href="./assets/icon-192.png">
<link rel="apple-touch-icon" href="./assets/icon-180.png">
<meta name="description" content="CSVを渡すとガウス過程のサロゲートモデルをその場で学習し、次に試すべき点を提案する能動学習・ベイズ最適化ツール。ブラウザ内で完結し、データは外部に送信されません。">

<meta property="og:type" content="website">
<meta property="og:site_name" content="BayesRobo">
<meta property="og:title" content="BayesRobo — 次に試すべき点を提案する能動学習">
<meta property="og:description" content="ガウス過程のサロゲートを学習し、最適解を追うか不確かな領域を潰すかを選んで次の候補点を提案します。ブラウザだけで動作。">
<meta property="og:url" content="https://ks278810.github.io/BayesRobo/">
<meta property="og:image" content="https://ks278810.github.io/BayesRobo/assets/ogp.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#020305">

<style>
  :root {
    --font-display: 'Chakra Petch', 'Segoe UI', sans-serif;
    --font-mono: 'IBM Plex Mono', 'Consolas', monospace;
    --font-body: 'Yu Gothic UI', 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;

    --void:        #06080f;
    --surface:     #0b0f1a;
    --surface-2:   #121828;
    --hairline:    rgba(255,255,255,0.07);

    --ink:         #eef3fa;
    --ink-dim:     #7a8ca6;
    --ink-faint:   #3d4a5e;

    --cyan:        #3fc4ec;
    --blue:        #4f7fe0;
    --good:        #2fd68e;
    --gold:        #f0a94e;
    --bad:         #ef5c5c;
  }

  * { box-sizing: border-box; }
  :focus-visible { outline: 2px solid rgba(63,196,236,0.7); outline-offset: 2px; }
  button:focus-visible, select:focus-visible { outline-offset: 3px; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important; animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important; scroll-behavior: auto !important;
    }
  }

  html { font-size: 16px; }
  html, body { height: 100%; margin: 0; }

  body {
    font-family: var(--font-body); color: var(--ink);
    margin: 0; min-height: 100vh; overflow: auto;
    display: flex; align-items: center; justify-content: center;

    align-items: safe center; justify-content: safe center;

    padding: 12px;
    background:
      radial-gradient(ellipse 1400px 900px at 50% 15%, rgba(63,196,236,0.10) 0%, transparent 55%),
      radial-gradient(ellipse 1000px 700px at 85% 90%, rgba(240,169,78,0.06) 0%, transparent 60%),
      repeating-linear-gradient(0deg,  rgba(63,196,236,0.025) 0px, rgba(63,196,236,0.025) 1px, transparent 1px, transparent 48px),
      repeating-linear-gradient(90deg, rgba(63,196,236,0.025) 0px, rgba(63,196,236,0.025) 1px, transparent 1px, transparent 48px),
      #020305;
  }

  .nice-scroll { scrollbar-width: thin; scrollbar-color: rgba(63,196,236,0.32) transparent; }
  .nice-scroll::-webkit-scrollbar { height: 8px; width: 8px; }
  .nice-scroll::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
  .nice-scroll::-webkit-scrollbar-thumb { background: rgba(63,196,236,0.28); border-radius: 4px; }
  .nice-scroll::-webkit-scrollbar-thumb:hover { background: rgba(63,196,236,0.5); }

  .app-frame {
    width: 1100px; height: 720px; flex-shrink: 0;
    position: relative;
    background: var(--void);
    border-radius: 10px;
    box-shadow: 0 30px 90px rgba(0,0,0,0.55), 0 0 0 1px rgba(255,255,255,0.05);
    zoom: var(--app-zoom, 1);
    display: flex; flex-direction: column; overflow: hidden;
    padding: 18px 20px 10px;
  }

  header { flex-shrink: 0; text-align: center; position: relative; padding-bottom: 12px; border-bottom: 1px solid var(--hairline); }
  .logo { height: 44px; width: auto; filter: drop-shadow(0 0 15px rgba(63,196,236,0.4)); }
  .lang-toggle {
    position: absolute; top: 50%; right: 0; transform: translateY(-50%);
    display: flex; border: 1px solid rgba(255,255,255,0.12); border-radius: 6px; overflow: hidden;
  }
  .lang-toggle-btn {
    position: relative; background: none; border: none; color: var(--ink-dim);
    font-family: var(--font-display);
    font-size: 11px; font-weight: 700; letter-spacing: 0.5px; padding: 0 10px; height: 34px;
    cursor: pointer; transition: all 0.2s;
  }

  .lang-toggle-btn::before {
    content: ''; position: absolute; top: 50%; left: 0; right: 0;
    height: 44px; transform: translateY(-50%);
  }
  .lang-toggle-btn + .lang-toggle-btn { border-left: 1px solid rgba(255,255,255,0.12); }
  .lang-toggle-btn.active { color: var(--cyan); background: rgba(63,196,236,0.1); }
  .lang-toggle-btn:hover:not(.active) { color: var(--ink); background: rgba(255,255,255,0.04); }

  .content-col { flex: 1; min-height: 0; display: flex; flex-direction: row; gap: 12px; padding-top: 10px; }
  .right-col { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 10px; }

  .left-col { flex: 0 0 250px; display: flex; flex-direction: column; min-height: 0; }
  .robo-hero {
    flex: 1; min-height: 0;
    border: 1px solid rgba(63,196,236,0.22); border-radius: 9px;
    background: radial-gradient(circle at 50% 30%, rgba(63,196,236,0.13), rgba(11,15,26,0.92));

    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 16px 12px;
  }

  .robo-box {
    width: 220px; height: 220px; border-radius: 50%; overflow: hidden;
    border: 2px solid rgba(63,196,236,0.4); background: #010204;
    box-shadow: 0 0 32px rgba(63,196,236,0.32); flex-shrink: 0;
    transition: all 0.6s cubic-bezier(0.16,1,0.3,1);
    margin-bottom: 8px; cursor: pointer;
  }
  .robo-box img { width: 100%; height: 100%; object-fit: cover; }

  .speech-bubble {
    width: 100%; background: rgba(11,15,26,0.65); border: 1px solid rgba(63,196,236,0.16);
    border-radius: 10px; padding: 12px 14px; color: #a9d4f5; font-size: 13.5px; line-height: 1.65;
    margin-bottom: 18px; position: relative; text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    flex-shrink: 0; overflow: visible;
  }
  .speech-bubble::after {
    content: ""; position: absolute; bottom: -8px; left: 50%; transform: translateX(-50%);
    border-width: 8px 8px 0; border-style: solid;
    border-color: rgba(63,196,236,0.16) transparent transparent;
  }

  #statusText { white-space: pre-wrap; word-break: auto-phrase; }
  #statusText:empty { display: none; }
  #statusText.error { color: var(--bad); }

  .bubble-actions { display: flex; flex-direction: column; gap: 7px; margin-top: 10px; align-items: stretch; }
  .bubble-btn {
    font-family: var(--font-display); font-size: 13px; font-weight: 700; letter-spacing: 0.02em;
    padding: 9px 12px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.14);
    background: rgba(255,255,255,0.04); color: var(--ink-dim); cursor: pointer; transition: all 0.15s;
  }
  .bubble-btn:hover { color: var(--ink); border-color: rgba(255,255,255,0.3); }
  .bubble-btn.toggle.active.optimize { color: var(--good); border-color: rgba(47,214,142,0.55); background: rgba(47,214,142,0.14); }
  .bubble-btn.toggle.active.accuracy { color: var(--blue); border-color: rgba(79,127,224,0.55); background: rgba(79,127,224,0.16); }
  .bubble-btn:disabled { opacity: 0.4; cursor: default; }
  .bubble-btn:disabled:hover { color: var(--ink-dim); border-color: rgba(255,255,255,0.14); }

  .bubble-group { display: flex; flex-direction: column; gap: 7px; }
  .bubble-group[hidden], .batch-row[hidden] { display: none; }
  .bubble-drop {
    border: 2px dashed rgba(63,196,236,0.5); border-radius: 10px; padding: 18px 8px;
    font-family: var(--font-display); font-size: 14px; font-weight: 700; color: var(--cyan);
    letter-spacing: 0.06em; cursor: pointer; transition: background 0.2s ease;
  }
  .bubble-drop:hover, .bubble-drop.hover { background: rgba(63,196,236,0.1); }
  .batch-row.under-robo { width: 100%; margin-top: 12px; }

  .batch-row { display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 12px; color: var(--ink-dim); }
  .batch-label { flex: none; font-family: var(--font-display); font-weight: 600; letter-spacing: 0.04em; }
  .batch-step {
    width: 26px; height: 26px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.14);
    background: rgba(255,255,255,0.04); color: var(--ink-dim); cursor: pointer; font-size: 14px; line-height: 1; padding: 0;
  }
  .batch-step:hover { color: var(--ink); border-color: rgba(255,255,255,0.3); }
  .batch-input {
    width: 44px; height: 26px; text-align: center; font-size: 13px; font-weight: 700;
    background: #0d1420; color: var(--ink); border: 1px solid rgba(255,255,255,0.12); border-radius: 6px;
    -moz-appearance: textfield; appearance: textfield;
  }
  .batch-input::-webkit-outer-spin-button, .batch-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .split-btn { position: relative; display: flex; gap: 0; }
  .split-btn #btnAccuracy, .split-btn #btnOptimize { flex: 1; border-radius: 999px 0 0 999px; }
  .split-btn .split-caret { width: 34px; padding: 9px 0; border-left: none; border-radius: 0 999px 999px 0; }
  .acc-menu {
    position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 20;
    display: flex; flex-direction: column; background: #080d18;
    border: 1px solid rgba(63,196,236,0.25); border-radius: 10px; overflow: hidden;
    box-shadow: 0 12px 32px rgba(0,0,0,0.7);
  }
  .acc-menu[hidden] { display: none; }
  .acc-menu button {
    text-align: left; font-size: 12px; line-height: 1.5; padding: 8px 12px; color: var(--ink-dim);
    background: none; border: none; cursor: pointer;
  }
  .acc-menu button + button { border-top: 1px solid var(--hairline); }
  .acc-menu button:hover, .acc-menu button:focus-visible { background: rgba(63,196,236,0.08); color: var(--ink); }
  .acc-menu button.selected { color: var(--cyan); }
  .acc-menu button small { font-size: 10px; opacity: 0.8; }
  .acc-menu button.selected::before { content: "\2713  "; }

  .download-btn {
    margin-top: 14px; width: 100%; flex-shrink: 0;
    font-family: var(--font-display); font-size: 13px; font-weight: 700; letter-spacing: 0.02em;
    padding: 9px 12px; border-radius: 999px;
    color: var(--cyan); border: 1px solid rgba(63,196,236,0.35); background: rgba(63,196,236,0.07);
    cursor: pointer; transition: all 0.15s;
  }
  .download-btn:hover:not(:disabled) { background: rgba(63,196,236,0.16); border-color: rgba(63,196,236,0.6); }
  .download-btn:disabled { opacity: 0.35; cursor: default; }

  .contour-row { flex: 0 0 auto; min-width: 0; display: flex; gap: 10px; align-items: flex-start; }
  .contour-card {
    flex: 1 1 0; min-width: 0;
    display: flex; flex-direction: column;
    border: 1px solid var(--hairline); border-radius: 9px;
    background: rgba(11,15,26,0.6); padding: 5px 8px 8px;
  }
  .contour-head { flex-shrink: 0; display: flex; align-items: center; gap: 5px; font-family: var(--font-mono); font-size: 12px; color: var(--ink-faint); padding: 1px 1px 6px; }
  .contour-head select {
    font-family: var(--font-mono); font-size: 12px; min-width: 0; flex: 1 1 0;
    background: var(--surface-2); color: var(--ink); border: 1px solid var(--hairline);
    border-radius: 4px; padding: 2px 3px; cursor: pointer;
  }
  .contour-head select:hover { border-color: var(--ink-faint); }
  .contour-body { aspect-ratio: 1 / 1; width: 100%; flex-shrink: 0; position: relative; }
  .contour-body canvas { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 4px; }
  .contour-body svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .contour-note {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 12.5px; color: var(--ink-faint); text-align: center; padding: 0 14px;
  }

  .pcp-row { flex: 1 1 0; min-height: 0; }
  .pcp-wrap {
    height: 100%; min-width: 0; min-height: 0;
    border: 1px solid var(--hairline); border-radius: 9px;
    background: linear-gradient(180deg, rgba(18,24,40,0.55), rgba(11,15,26,0.85));
    position: relative; overflow: hidden;
    display: flex; flex-direction: column;
  }
  .pcp-scroll { flex: 1; min-height: 0; overflow-x: auto; overflow-y: hidden; }
  .pcp-scroll svg { display: block; height: 100%; }

  .drop-zone {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 8px; cursor: pointer; transition: background 0.2s ease;
  }
  .drop-zone.hover { background: rgba(63,196,236,0.08); }
  .drop-zone-sub { font-size: 12.5px; color: var(--ink-dim); text-align: center; line-height: 1.6; max-width: 380px; }

  .pcp-axis-line { stroke: rgba(170,195,220,0.28); }

  .pcp-filter-handle {
    fill: rgba(150,175,205,0.75); stroke: #06111c; stroke-width: 0.8;
    cursor: ns-resize; transition: fill 0.12s;
  }
  .pcp-filter-handle:hover { fill: #cfeaff; }
  .pcp-filter-handle.active { fill: var(--cyan); }
  .pcp-filter-range { stroke: rgba(63,196,236,0.5); stroke-width: 3; stroke-linecap: round; pointer-events: none; }

  .pcp-tip-box { fill: rgba(6,17,28,0.95); stroke: rgba(63,196,236,0.55); stroke-width: 1; }
  .pcp-tip-text { fill: #eef3fa; }

  .pcp-candidate-line { stroke-width: 3; cursor: default; }
  .pcp-candidate-line.optimize { stroke: var(--good); animation: candidateLineGlowGreen 1.15s ease-in-out infinite; }
  .pcp-candidate-line.accuracy { stroke: var(--blue); animation: candidateLineGlowBlue 1.15s ease-in-out infinite; }
  @keyframes candidateLineGlowGreen {
    0%, 100% { opacity: 0.62; filter: drop-shadow(0 0 3px rgba(47,214,142,0.55)); }
    50%      { opacity: 1;    filter: drop-shadow(0 0 14px rgba(47,214,142,1)); }
  }
  @keyframes candidateLineGlowBlue {
    0%, 100% { opacity: 0.62; filter: drop-shadow(0 0 3px rgba(79,127,224,0.55)); }
    50%      { opacity: 1;    filter: drop-shadow(0 0 14px rgba(79,127,224,1)); }
  }
  .pcp-candidate-point { stroke: #eef3fa; stroke-width: 1.6; }
  .pcp-candidate-point.optimize { fill: var(--good); }
  .pcp-candidate-point.accuracy { fill: var(--blue); }

  .proposal-marker { transform-box: fill-box; transform-origin: center; cursor: pointer; }
  .proposal-marker.optimize { animation: pulseGreen 1.3s ease-in-out infinite; }
  .proposal-marker.accuracy { animation: pulseBlue 1.5s ease-in-out infinite; }
  @keyframes pulseGreen {
    0%, 100% { transform: scale(1);    filter: drop-shadow(0 0 6px rgba(47,214,142,0.8)); }
    50%      { transform: scale(1.4);  filter: drop-shadow(0 0 26px rgba(47,214,142,1)); }
  }
  @keyframes pulseBlue {
    0%, 100% { transform: scale(1);    filter: drop-shadow(0 0 6px rgba(79,127,224,0.8)); }
    50%      { transform: scale(1.32); filter: drop-shadow(0 0 22px rgba(79,127,224,1)); }
  }
  .proposal-halo { transform-box: fill-box; transform-origin: center; pointer-events: none; }
  .proposal-halo.optimize { animation: haloGreen 1.3s ease-in-out infinite; }
  .proposal-halo.accuracy { animation: haloBlue 1.5s ease-in-out infinite; }
  @keyframes haloGreen { 0% { transform: scale(0.8); opacity: 0.55; } 100% { transform: scale(2.2); opacity: 0; } }
  @keyframes haloBlue  { 0% { transform: scale(0.8); opacity: 0.5; }  100% { transform: scale(2.0); opacity: 0; } }

  .status-bar {
    flex-shrink: 0; margin-top: 10px; height: 24px;
    display: flex; align-items: center; gap: 8px;
    background: rgba(11,15,26,0.55); border-radius: 6px;
    padding: 0 12px; border: 1px solid var(--hairline);
  }
  .sb-dot { width: 5px; height: 5px; border-radius: 50%; background: #2d4052; flex-shrink: 0; transition: background 0.3s; }
  .sb-dot.active { background: var(--good); animation: sbDotPulse 1s infinite ease-in-out; }
  .sb-dot.warn   { background: var(--gold); animation: sbDotPulse 0.7s infinite ease-in-out; }
  .sb-dot.error  { background: var(--bad); }
  @keyframes sbDotPulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

  .sb-label {
    font-family: var(--font-display); font-size: 11.5px; font-weight: 700; letter-spacing: 0.1em;
    color: var(--ink-dim); text-transform: uppercase;
    min-width: 0; flex-shrink: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .sb-label.active { color: var(--cyan); }
  .sb-badge {
    padding: 2px 8px; border-radius: 999px; border: 1px solid var(--hairline);
    font-size: 11.5px; white-space: nowrap; max-width: 170px;
    overflow: hidden; text-overflow: ellipsis; flex-shrink: 0;
  }

  .sb-credit {
    position: relative;
    margin-left: auto; font-size: 11px; font-weight: 600; letter-spacing: 0.01em;
    color: #8fb0f0; opacity: 0.9; white-space: nowrap; flex-shrink: 0; cursor: pointer;
    transition: all 0.15s ease; padding: 3px 11px; border-radius: 20px;
    background: rgba(63,196,236,0.09); border: 1px solid rgba(63,196,236,0.28);
  }
  .sb-credit:hover { opacity: 1; color: var(--cyan); background: rgba(63,196,236,0.18); border-color: rgba(63,196,236,0.5); }

  .sb-credit::before {
    content: ''; position: absolute; top: 50%; left: 0; right: 0;
    height: 44px; transform: translateY(-50%);
  }

  #aboutOverlay {
    position: absolute; inset: 0; background: rgba(0,0,0,0.75);
    z-index: 100; display: flex; justify-content: center; align-items: center;
  }
  #aboutPanel {
    background: #080d18; border: 1px solid rgba(63,196,236,0.2);
    border-radius: 12px; padding: 24px 28px; width: min(420px, calc(100% - 48px));
    box-shadow: 0 25px 80px rgba(0,0,0,0.85);
  }
  .settings-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 20px; padding-bottom: 12px; border-bottom: 1px solid var(--hairline);
  }
  .settings-title { font-family: var(--font-display); font-size: 14px; font-weight: 700; letter-spacing: 3px; color: var(--cyan); text-transform: uppercase; }
  .settings-close-btn {
    background: none; border: none; color: #6b7280; font-size: 18px; cursor: pointer;
    line-height: 1; padding: 2px 8px; border-radius: 4px; transition: all 0.15s;
  }
  .settings-close-btn:hover { color: var(--bad); background: rgba(239,68,68,0.08); }
  .settings-info-body { font-size: 13px; color: #8a9bb0; line-height: 1.75; }
  .settings-info-body a { color: var(--cyan); }
  .settings-info-body b { color: var(--ink); }

  #globalDropOverlay {
    position: absolute; inset: 10px; z-index: 50; display: none;
    border: 3px dashed rgba(63,196,236,0.55); border-radius: 14px;
    background: rgba(6,10,20,0.55);
    align-items: center; justify-content: center; pointer-events: none;
  }
  #globalDropOverlay.show { display: flex; }
  #globalDropOverlay .hint {
    font-family: var(--font-display); font-size: 19px; color: var(--cyan); font-weight: 700;
    letter-spacing: 0.1em; text-transform: uppercase;
    text-shadow: 0 0 20px rgba(63,196,236,0.6);
  }
  .sb-badge[hidden] { display: none; }
</style>
</head>
<body>
  <div class="app-frame">
    <header>

      <div class="lang-toggle" role="group" aria-label="Language / 言語 / 语言">
        <button type="button" class="lang-toggle-btn" data-lang="ja">日本語</button>
        <button type="button" class="lang-toggle-btn" data-lang="en">EN</button>
        <button type="button" class="lang-toggle-btn" data-lang="zh">中文</button>
      </div>
      <img src="./assets/logo.png" class="logo" alt="BayesRobo">
    </header>

    <div id="globalDropOverlay"><div class="hint" id="globalDropHint">DROP CSV</div></div>

    <div class="content-col">
      <div class="left-col">
          <div class="robo-hero">
            <div class="speech-bubble">
              <div id="statusText">...</div>
              <div class="bubble-actions">
                <div class="bubble-group" id="loadActions">
                  <div id="bubbleDrop" class="bubble-drop" role="button" tabindex="0"></div>
                  <button type="button" id="btnTrySample" class="bubble-btn"></button>
                </div>
                <div class="bubble-group" id="pickActions" hidden>
                  <div class="split-btn">
                    <button type="button" id="btnOptimize" class="bubble-btn toggle optimize"></button>
                    <button type="button" id="btnGoal" class="bubble-btn split-caret" aria-haspopup="menu" aria-expanded="false">&#9662;</button>
                    <div id="goalMenu" class="acc-menu" role="menu" hidden>
                    <button type="button" role="menuitemradio" data-goal="min" aria-checked="true"></button>
                    <button type="button" role="menuitemradio" data-goal="max" aria-checked="false"></button>
                    </div>
                </div>
                  <div class="split-btn">
                    <button type="button" id="btnAccuracy" class="bubble-btn toggle accuracy"></button>
                    <button type="button" id="btnAccMethod" class="bubble-btn split-caret" aria-haspopup="menu" aria-expanded="false">&#9662;</button>
                    <div id="accMethodMenu" class="acc-menu" role="menu" hidden>
                    <button type="button" role="menuitemradio" data-method="vigf" aria-checked="true"></button>
                    <button type="button" role="menuitemradio" data-method="maximin" aria-checked="false"></button>
                    </div>
                </div>
                </div>
              </div>
            </div>
            <div class="robo-box"><img id="roboImg" src="./assets/joy.gif" alt=""></div>
            <div class="batch-row under-robo" hidden id="batchRow">
              <span class="batch-label" id="batchLabel"></span>
              <button type="button" class="batch-step" id="btnBatchDec" aria-label="-">&minus;</button>
              <input id="batchInput" class="batch-input" type="number" min="1" max="20" step="1" value="1" inputmode="numeric" aria-labelledby="batchLabel">
              <button type="button" class="batch-step" id="btnBatchInc" aria-label="+">+</button>
            </div>

            <button type="button" id="btnDownload" class="download-btn" disabled></button>
          </div>
      </div>

      <div class="right-col">
        <div class="contour-row">

          <div class="contour-card">
            <div class="contour-head">
              <span id="ct0xLbl">X</span><select id="ct0x" aria-labelledby="ct0xLbl"></select>
              <span id="ct0yLbl">Y</span><select id="ct0y" aria-labelledby="ct0yLbl"></select>
            </div>
            <div class="contour-body" id="ct0body"><canvas id="ct0canvas"></canvas><svg id="ct0svg"></svg></div>
          </div>
          <div class="contour-card">
            <div class="contour-head">
              <span id="ct1xLbl">X</span><select id="ct1x" aria-labelledby="ct1xLbl"></select>
              <span id="ct1yLbl">Y</span><select id="ct1y" aria-labelledby="ct1yLbl"></select>
            </div>
            <div class="contour-body" id="ct1body"><canvas id="ct1canvas"></canvas><svg id="ct1svg"></svg></div>
          </div>
          <div class="contour-card">
            <div class="contour-head">
              <span id="ct2xLbl">X</span><select id="ct2x" aria-labelledby="ct2xLbl"></select>
              <span id="ct2yLbl">Y</span><select id="ct2y" aria-labelledby="ct2yLbl"></select>
            </div>
            <div class="contour-body" id="ct2body"><canvas id="ct2canvas"></canvas><svg id="ct2svg"></svg></div>
          </div>
        </div>

        <div class="pcp-row">
          <div class="pcp-wrap" id="pcpWrap">
            <div class="pcp-scroll nice-scroll" id="pcpScroll"></div>

          </div>
        </div>
      </div>
    </div>

    <div class="status-bar">
      <div class="sb-dot" id="sbDot"></div>
      <div class="sb-label" id="sbLabel">-</div>
      <span class="sb-badge" id="fileBadge">-</span>
      <span class="sb-badge" id="intBadge" hidden></span>
      <div class="sb-credit" id="sbCredit"></div>
    </div>

    <div id="aboutOverlay" style="display:none">
      <div id="aboutPanel">
        <div class="settings-header">
          <span class="settings-title" id="aboutTitle">ABOUT</span>
          <button id="aboutCloseBtn" class="settings-close-btn" type="button">✕</button>
        </div>
        <div class="settings-info-body" id="aboutBody"></div>
      </div>
    </div>
  </div>

  <input type="file" id="fileInput" accept=".csv,text/csv" style="display:none">

  <script type="module" src="./bayesrobo-worker-client.js"></script>
  <script src="./app.js" defer></script>
</body>
</html>
